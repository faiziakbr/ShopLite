spring.application.name=order-service
server.port=8083
spring.threads.virtual.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info
spring.mvc.problemdetails.enabled=true
spring.docker.compose.file=../compose.yaml
spring.docker.compose.profiles.active=order

spring.http.serviceclient.product.base-url=http://localhost:8081
spring.http.serviceclient.product.connect-timeout=2s
spring.http.serviceclient.product.read-timeout=3s

spring.http.serviceclient.inventory.base-url=http://localhost:8082
spring.http.serviceclient.inventory.connect-timeout=2s
spring.http.serviceclient.inventory.read-timeout=3s